[workspace]
members = ["crates/codebeat", "crates/codebeat-runner", "desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

codebeat-lib = { path = "crates/codebeat" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
