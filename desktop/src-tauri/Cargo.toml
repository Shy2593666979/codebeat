[package]
name = "codebeat"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "codebeat"
[features]
# 仅用于隔离的原生通知回归；正式打包不启用调试端口。
notification-test = []
[build-dependencies]
tauri-build = { version = "~2.7", features = [] }
[dependencies]
tauri = { version = "~2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio.workspace = true
chrono.workspace = true
uuid.workspace = true
codebeat-lib.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug"] }
