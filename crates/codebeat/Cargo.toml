[package]
name = "codebeat-lib"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "codebeat-protocol-fixture"
path = "tests/fixtures/protocol.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
chrono-tz = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
which = "8"
walkdir = "2"
async-trait = "0.1"
regex = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Globalization", "Win32_System_Console", "Management_Deployment", "ApplicationModel", "Storage_Search", "Foundation_Collections", "Win32_System_Com", "Win32_System_TaskScheduler", "Win32_System_Variant", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }
